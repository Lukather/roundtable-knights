configVersion: v2

apps:
  - name: roundtable-knights
    build:
      context: .
      dockerfile: Dockerfile
    port: 3000
    probe: /
    env:
      NODE_ENV: production
      DATA_DIR: /tmp/data
    secrets:
      - env: ANTHROPIC_API_KEY
        secret: greenhouselore
        key: ANTHROPIC_API_KEY
    resources:
      cpu: 250m/500m
      memory: 256Mi/512Mi
